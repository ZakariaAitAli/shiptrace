services:
  postgres:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: shiptrace
      POSTGRES_USER: shiptrace_admin
      POSTGRES_PASSWORD: ${SHIPTRACE_ADMIN_PASSWORD:?set it in .env}
      SHIPTRACE_APP_PASSWORD: ${SHIPTRACE_APP_PASSWORD:?set it in .env}
      SHIPTRACE_MIGRATOR_PASSWORD: ${SHIPTRACE_MIGRATOR_PASSWORD:?set it in .env}
    volumes:
      - ./deploy/postgres/bootstrap_roles.sql:/docker-entrypoint-initdb.d/10-bootstrap-roles.sql:ro
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${SHIPTRACE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiptrace_admin -d shiptrace"]
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 30s

volumes:
  postgres-data:
