[project]
name = "shiptrace"
version = "0.1.0"
description = "Deployment tracking service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.162.0,<0.163",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic-settings>=2.16.2,<3",
    "sqlalchemy>=2.1.6,<2.2",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
shiptrace-migrate = "shiptrace.bootstrap.migrate:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "import-linter>=2.15,<3",
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.3,<0.18",
    "testcontainers>=4.15.0,<5",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["shiptrace"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "shiptrace"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["bootstrap", "api | persistence", "application", "domain"]
containers = ["shiptrace"]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework-free"
type = "forbidden"
source_modules = ["shiptrace.domain", "shiptrace.application"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "alembic", "psycopg"]

[[tool.importlinter.contracts]]
name = "API does not touch database libraries"
type = "forbidden"
source_modules = ["shiptrace.api"]
forbidden_modules = ["sqlalchemy", "alembic", "psycopg"]
